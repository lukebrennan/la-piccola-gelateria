name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Project pages live at /<repo-name>/. Set CUSTOM_DOMAIN as a repository variable and
      # BASE_HREF to "/" once the custom domain is connected.
      - run: npm run build:pages
        env:
          BASE_HREF: ${{ vars.BASE_HREF || format('/{0}/', github.event.repository.name) }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/la-piccola-gelateria/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
